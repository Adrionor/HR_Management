<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Instrucciones Enviadas - Premier Automotriz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=72:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: '72', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f3f5f8; display: grid; place-items: center; height: 100vh; margin: 0; }
        .container { max-width: 460px; padding: 2.5rem; background-color: #ffffff; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); border: 1px solid #d9e1e8; text-align: center; }
        .icon-circle { width: 56px; height: 56px; border-radius: 50%; background: #ebf5fe; display: inline-flex; justify-content: center; align-items: center; color: #0070f2; margin-bottom: 1rem; }
        h1 { color: #1d2d3e; font-size: 1.35rem; margin: 0 0 0.75rem 0; font-weight: 700; }
        p { color: #556b82; font-size: 0.9rem; line-height: 1.5; margin: 0 0 1.5rem 0; }
        a { display: inline-block; text-decoration: none; background-color: #0070f2; color: white; padding: 0.65rem 1.5rem; border-radius: 6px; font-weight: 600; font-size: 0.875rem; transition: background-color 0.15s ease; }
        a:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-circle">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
        </div>
        <h1>Revisa tu Correo Electrónico</h1>
        <p>Hemos enviado las instrucciones para restablecer tu contraseña. Si no lo encuentras en tu bandeja de entrada en unos instantes, verifica en la carpeta de correo no deseado (spam).</p>
        <a href="{% url 'login' %}">Volver a Inicio de Sesión</a>
    </div>
</body>
</html>
